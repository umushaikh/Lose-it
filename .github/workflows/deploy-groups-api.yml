# Deploys the Friends server to your own Cloudflare account, from a button on
# github.com. This exists so the whole thing can be done from a phone: the
# heavy lifting happens on a GitHub runner, not on your device.
#
# One-time setup (all in a browser):
#   1. Make a free Cloudflare account.
#   2. Create an API token with Workers Scripts:Edit and D1:Edit
#      (plus Workers R2 Storage:Edit if you want photos).
#   3. In this repo: Settings -> Secrets and variables -> Actions, add
#      CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
#   4. Actions -> "Deploy group server" -> Run workflow.
name: Deploy group server

on:
  workflow_dispatch:
    inputs:
      enable_photos:
        description: 'Also enable photo sharing (needs R2, which asks Cloudflare for a payment method)'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: calorie-counter-groups
      BUCKET_NAME: calorie-counter-photos

    steps:
      - uses: actions/checkout@v4

      # wrangler 4.x refuses to run on anything older than Node 22 - it
      # prints a warning and exits 1 rather than actually failing loudly, so
      # this silently breaks every step after it if left too low.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Fail with something readable rather than a wrangler stack trace, since
      # a missing secret is by far the likeliest way this goes wrong.
      - name: Check the secrets are set
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under Settings -> Secrets and variables -> Actions."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set. It is the Account ID shown on your Cloudflare Workers & Pages page."
            missing=1
          fi
          [ "$missing" = 0 ]

      # A secret pasted from a phone keyboard easily picks up a trailing
      # newline or space that is invisible in the GitHub secret field - that
      # single stray character turns "accounts/<id>/d1/database" into a URL
      # with a newline in the middle of it, which every HTTP client refuses to
      # send. Whitespace is never legitimately part of a token or account id,
      # so strip all of it, everywhere in the string, and re-mask the results
      # since a trimmed value no longer matches the original secret exactly.
      - name: Normalize the secrets
        run: |
          CLEAN_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          CLEAN_ACCOUNT="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          echo "::add-mask::$CLEAN_TOKEN"
          echo "::add-mask::$CLEAN_ACCOUNT"
          echo "CLOUDFLARE_API_TOKEN=$CLEAN_TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$CLEAN_ACCOUNT" >> "$GITHUB_ENV"
          if [ "$CLEAN_ACCOUNT" != "$CLOUDFLARE_ACCOUNT_ID" ] || [ "$CLEAN_TOKEN" != "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::One of the Cloudflare secrets had stray whitespace in it (likely from a copy-paste) - it has been trimmed automatically for this run. Worth re-pasting the secret cleanly next time, but nothing to do now."
          fi

      - name: Install wrangler
        run: npm ci

      # Probes each capability the deploy needs and names the missing checkbox.
      # Wrangler's own error for a mis-scoped token does not tell you which
      # permission it wanted.
      - name: Check the token can do what the deploy needs
        run: python3 scripts/cf-preflight.py ${{ inputs.enable_photos && '--photos' || '' }}

      - name: Create the database if it does not exist yet
        run: |
          if npx wrangler d1 list --json | grep -q "\"name\": *\"$DB_NAME\""; then
            echo "Database $DB_NAME already exists, leaving it alone."
          else
            echo "Creating database $DB_NAME"
            npx wrangler d1 create "$DB_NAME"
          fi

      # The id is generated by Cloudflare, so it cannot be committed. Read it
      # back and write it into the config for this run only.
      - name: Point the config at the database
        run: |
          DB_ID="$(npx wrangler d1 list --json | python3 scripts/d1-id.py "$DB_NAME")"
          if [ -z "$DB_ID" ]; then
            echo "::error::Could not read the database id back from Cloudflare."
            exit 1
          fi
          echo "Using database_id $DB_ID"
          sed -i "s|database_id = \"[^\"]*\"|database_id = \"$DB_ID\"|" api/wrangler.toml
          grep database_id api/wrangler.toml

      - name: Enable photo storage
        if: ${{ inputs.enable_photos }}
        run: |
          npx wrangler r2 bucket create "$BUCKET_NAME" || echo "Bucket already exists, continuing."
          # Uncomment the binding so the Worker can see the bucket.
          sed -i 's|^# \[\[r2_buckets\]\]|[[r2_buckets]]|; s|^# binding = "PHOTOS"|binding = "PHOTOS"|; s|^# bucket_name = "calorie-counter-photos"|bucket_name = "calorie-counter-photos"|' api/wrangler.toml
          tail -5 api/wrangler.toml

      - name: Create the tables
        run: npx wrangler d1 execute "$DB_NAME" --remote --config api/wrangler.toml --file=api/schema.sql -y

      - name: Deploy the Worker
        id: deploy
        run: |
          npx wrangler deploy --config api/wrangler.toml 2>&1 | tee deploy.log
          URL="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Show the address to paste into the app
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          {
            echo "## Your group server is live"
            echo
            if [ -n "$URL" ]; then
              echo '```'
              echo "$URL"
              echo '```'
              echo
              echo "Copy that address, open the app, go to **Friends**, paste it in,"
              echo "enter your name and tap **Start a new group**."
            else
              echo "Deployed, but the address could not be read from the log."
              echo "Find it in the Cloudflare dashboard under Workers & Pages."
            fi
            echo
            echo "Photo sharing: **${{ inputs.enable_photos && 'on' || 'off' }}**"
          } >> "$GITHUB_STEP_SUMMARY"
