name = "calorie-counter-groups"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Filled in by `npm run api:setup`, which creates the database and prints the id.
[[d1_databases]]
binding = "DB"
database_name = "calorie-counter-groups"
database_id = "PLACEHOLDER_RUN_API_SETUP"

# Photo sharing is optional and off by default. R2 asks for a payment method on
# the account even to use its free tier, and the board works without it, so
# uncomment this only when you actually want photos in the feed. Create the
# bucket first: npx wrangler r2 bucket create calorie-counter-photos
# [[r2_buckets]]
# binding = "PHOTOS"
# bucket_name = "calorie-counter-photos"

[vars]
# Billing safety net for R2, the one piece of this deployment that a card on
# file can actually be charged for (Workers and D1 stay on the free plan and
# simply reject over-quota requests, never bill). PHOTO_STORAGE_CEILING_MB is
# a hard cap the server enforces itself before accepting a new photo upload -
# 2 GiB by default, deliberately far under R2's 10 GB free tier, and holds
# tens of thousands of photos at this app's compression, so raise it only if
# you are sure you want to. PHOTOS_PAUSED is a manual off-switch: flip it to
# "true" here (or directly in the Worker's dashboard Variables tab, which
# takes effect immediately with no redeploy) to stop uploads at once if usage
# ever looks wrong, without touching anything else.
PHOTO_STORAGE_CEILING_MB = "2048"
PHOTOS_PAUSED = "false"
